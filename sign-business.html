<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ציור חתימת העסק</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    margin: 0;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p { color: #555; margin-top: 0; }
  canvas {
    background: #fff;
    border: 2px dashed #6b21a8;
    border-radius: 8px;
    touch-action: none;
    max-width: 100%;
  }
  .buttons {
    margin-top: 16px;
    display: flex;
    gap: 12px;
  }
  button {
    font-size: 16px;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  #save {
    background: #6b21a8;
    color: #fff;
  }
  #clear {
    background: #e5e5e5;
    color: #333;
  }
  #status {
    margin-top: 12px;
    font-size: 14px;
    color: #16a34a;
    min-height: 20px;
  }
</style>
</head>
<body>
  <h1>ציור חתימת העסק</h1>
  <p>צייר את החתימה שלך באצבע/עכבר בתוך המסגרת, ואז לחץ "שמור כתמונה"</p>
  <canvas id="pad" width="600" height="250"></canvas>
  <div class="buttons">
    <button id="clear">נקה</button>
    <button id="save">שמור כתמונה</button>
  </div>
  <div id="status"></div>

  <script>
    const canvas = document.getElementById('pad');
    const ctx = canvas.getContext('2d');
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000';

    let drawing = false;
    let hasDrawn = false;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const point = e.touches ? e.touches[0] : e;
      return {
        x: (point.clientX - rect.left) * scaleX,
        y: (point.clientY - rect.top) * scaleY
      };
    }

    function start(e) {
      drawing = true;
      hasDrawn = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      e.preventDefault();
    }

    function move(e) {
      if (!drawing) return;
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      e.preventDefault();
    }

    function end() {
      drawing = false;
    }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);

    document.getElementById('clear').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
      document.getElementById('status').textContent = '';
    });

    document.getElementById('save').addEventListener('click', () => {
      if (!hasDrawn) {
        document.getElementById('status').style.color = '#dc2626';
        document.getElementById('status').textContent = 'לא ציירת עדיין חתימה';
        return;
      }
      const link = document.createElement('a');
      link.download = 'business-signature.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      document.getElementById('status').style.color = '#16a34a';
      document.getElementById('status').textContent = 'נשמר! שים את הקובץ בתיקיית assets בשם business-signature.png';
    });
  </script>
</body>
</html>
